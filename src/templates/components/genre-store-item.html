<li class="genre-store-item" data-store-id="${storeId}">
  <div class="store-item-content">
    <div class="store-item-info">
      <div class="store-item-name"><b>${storeName}</b></div>
      <div class="store-item-product">
        ${itemName} → <b>${itemPrice}</b>
      </div>
      <div class="store-item-distance">
        距離：${distanceText}
      </div>
    </div>
  </div>
</li>

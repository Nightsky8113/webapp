<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="近くのスーパーのチラシからお得な商品を検索">
    <title>チラシ検索アプリ</title>

    <!-- UnoCSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- jQuery (Lightbox2の依存関係) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Lightbox2 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" />
    
    <!-- Lightbox2 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- ヘッダー -->
    <header id="app-header" class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" id="logo">
                    🛒 チラシ検索
                </h1>
                <nav class="hidden md:flex gap-4">
                    <a href="#/home" class="text-gray-600 hover:text-blue-600 transition-colors">ホーム</a>
                    <a href="#/stores" class="text-gray-600 hover:text-blue-600 transition-colors">店舗一覧</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main id="app" class="max-w-7xl mx-auto px-4 py-6">
        <!-- ページコンテンツがここに動的に挿入されます -->
        <div class="flex items-center justify-center min-h-[60vh]">
            <div class="text-center">
                <div class="text-6xl mb-4">📱</div>
                <p class="text-gray-500">読み込み中...</p>
            </div>
        </div>
    </main>

    <!-- メインJSファイル -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>

<div class="store-card" data-store-id="${id}">
  <div class="store-card-flyer-wrap">
    <img
      src="${thumbnailUrl}"
      alt="${storeName}のチラシ"
      class="store-card-flyer"
      loading="lazy"
    />
    <div class="store-card-badge">NEW</div>
  </div>

  <div class="store-card-body">
    <h3 class="store-card-title">${storeName}</h3>

    <div class="store-card-meta">
      ${if:showDistance}
      <div class="store-card-meta-row">
        <span class="store-card-meta-icon">📍</span>
        <span>現在地から ${distanceText}</span>
      </div>
      ${endif}

      ${if:showStation}
      <div class="store-card-meta-row">
        <span class="store-card-meta-icon">🚶</span>
        <span>${stationLine}</span>
      </div>
      ${endif}

      ${if:showAddress}
      <div class="store-card-meta-row">
        <span class="store-card-meta-icon">📍</span>
        <span>${address}</span>
      </div>
      ${endif}

      ${if:hasItemInfo}
      <div class="item-highlight store-card-product">
        <span class="store-card-meta-icon">🏷️</span>
        <div class="store-card-product-text">
          <div class="store-card-item-name">${itemName}</div>
          <div class="store-card-price">${itemPrice}</div>
        </div>
      </div>
      ${endif}

      ${if:showApiNote}
      <p class="store-card-api-note">※ 地図データのみ（商品情報なし）</p>
      ${endif}
    </div>
  </div>
</div>

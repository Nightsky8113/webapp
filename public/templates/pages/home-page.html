<div class="space-y-8">
  <!-- ヒーローセクション -->
  <div class="hero-section">
    <h1>🛒 チラシ検索</h1>
    <p>近くのお得な商品をすぐに見つけよう</p>
  </div>

  <!-- お店を探す -->
  <section>
    <h2 class="section-title">お店を探す</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 商品から探す -->
      <button
        id="search-by-product"
        class="search-option-card product"
        aria-label="商品から探す"
      >
        <div class="search-option-card-content">
          <h3 class="card-title">商品から探す</h3>
          <p class="card-description">商品名で検索またはジャンルから選択できます</p>
          <div class="card-info">
            📍 位置情報から5km圏内の商品を安い順で表示
          </div>
        </div>
      </button>

      <!-- 位置情報から探す -->
      <button
        id="search-by-location"
        class="search-option-card location"
        aria-label="位置情報から探す"
      >
        <div class="search-option-card-content">
          <h3 class="card-title">位置情報から探す</h3>
          <p class="card-description">現在地から近い順に店舗を表示します</p>
          <div class="card-info">
            🏪 最大6店舗を距離順で表示
          </div>
        </div>
      </button>
    </div>
  </section>

  <!-- 今日更新されたチラシ -->
  ${if:hasTodayFlyers}
  <section>
    <div class="flex items-center justify-between mb-5">
      <h2 class="section-title">🆕 更新日時が今日のチラシ</h2>
    </div>
    <div 
      id="today-flyers-container" 
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    >
      ${todayStoresHTML}
    </div>
  </section>
  ${endif}
  ${if:noTodayFlyers}
  <section>
    <div class="empty-state">
      <div class="empty-icon">📰</div>
      <p class="empty-text">今日更新されたチラシはありません</p>
    </div>
  </section>
  ${endif}
</div>

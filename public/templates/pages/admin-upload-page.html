<div class="admin-upload-page">
  ${if:noStores}
  <div class="empty-state">
    <div class="empty-icon">⚠️</div>
    <p class="empty-text">店舗が登録されていません</p>
    <button id="back-button" class="btn-primary mt-4">ホームに戻る</button>
  </div>
  ${endif}
  
  ${if:hasStores}
  <div class="space-y-6">
    <div class="flex items-center gap-4">
      <button id="back-button" class="btn-back">
        <span class="text-lg">←</span>
        <span>戻る</span>
      </button>
      <h1 class="page-title">チラシ画像アップロード</h1>
    </div>

    <div class="upload-form-card">
      <form id="upload-form">
        <div class="form-group">
          <label for="store-search" class="form-label">店舗を選択</label>
          <div class="store-search-container">
            <input 
              type="text" 
              id="store-search" 
              name="storeSearch" 
              class="form-input store-search-input" 
              placeholder="店舗名で検索..."
              autocomplete="off"
            />
            <div id="store-autocomplete" class="store-autocomplete hidden"></div>
            <select id="store-select" name="storeId" class="form-select store-select-hidden" required>
              <option value="">-- 店舗を選択してください --</option>
              ${storeOptionsHTML}
            </select>
          </div>
          <p class="form-help">店舗名を入力すると候補が表示されます</p>
        </div>

        <div class="form-group">
          <label for="file-input" class="form-label">画像ファイルを選択</label>
          <input 
            type="file" 
            id="file-input" 
            name="file" 
            accept="image/jpeg,image/jpg,image/png,image/webp,image/gif" 
            class="form-file-input"
            required
          />
          <p class="form-help">対応形式: JPEG, PNG, WebP, GIF / 最大サイズ: 50MB</p>
        </div>

        <div class="form-group">
          <label class="form-checkbox">
            <input 
              type="checkbox" 
              id="enable-ocr" 
              name="enableOCR"
            />
            <span class="ml-2">OCR処理を実行する（商品情報を自動抽出）</span>
          </label>
          <p class="form-help">チェックすると、画像から商品情報を自動抽出します（1-2分かかる場合があります）</p>
        </div>

        <div id="preview-area" class="preview-area hidden"></div>

        <div id="upload-status" class="upload-status hidden"></div>

        <button type="submit" id="upload-button" class="btn-primary w-full mt-6">
          アップロード
        </button>
      </form>
    </div>
  </div>
  ${endif}
</div>

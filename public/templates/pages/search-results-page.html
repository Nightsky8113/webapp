<div class="space-y-6">
  <!-- ヘッダー -->
  <div class="flex items-center gap-4">
    <button 
      id="back-button"
      class="btn-back"
      aria-label="戻る"
    >
      <span class="text-lg">←</span>
      <span>戻る</span>
    </button>
    <h1 class="text-3xl font-bold text-gray-800">
      「${queryText}」の検索結果
    </h1>
  </div>
  
  <!-- フィルター＆ソートパネル -->
  <div class="filter-panel">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- 最小価格 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          最小価格
        </label>
        <input 
          type="number" 
          id="min-price"
          value="${minPrice}"
          min="0"
          class="filter-input"
          aria-label="最小価格"
        />
      </div>
      
      <!-- 最大価格 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          最大価格
        </label>
        <input 
          type="number" 
          id="max-price"
          value="${maxPrice}"
          min="0"
          class="filter-input"
          aria-label="最大価格"
        />
      </div>
      
      <!-- 最大距離 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          最大距離（km）
        </label>
        <input 
          type="number" 
          id="max-distance"
          value="${maxDistance}"
          min="1"
          max="50"
          class="filter-input"
          aria-label="最大距離"
        />
      </div>
      
      <!-- ソート -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          並び順
        </label>
        <select 
          id="sort-by"
          class="filter-select"
          aria-label="並び順"
        >
          <option value="price-asc" ${sortByPriceAscSelected}>価格（安い順）</option>
          <option value="price-desc" ${sortByPriceDescSelected}>価格（高い順）</option>
          <option value="distance" ${sortByDistanceSelected}>距離（近い順）</option>
        </select>
      </div>
    </div>
    
    <!-- 適用ボタン -->
    <div class="mt-4 flex justify-end">
      <button 
        id="apply-filters"
        class="btn-primary-large"
        aria-label="フィルターを適用"
      >
        フィルターを適用 →
      </button>
    </div>
  </div>
  
  <!-- 検索結果数 -->
  <div class="info-box blue">
    <p>
      ${resultsCount}件の商品が見つかりました
    </p>
  </div>
  
  <!-- 検索結果一覧 -->
  <div class="space-y-4">
    ${resultsHTML}
  </div>
  
  ${if:noResults}
  <div class="empty-state">
    <div class="empty-icon">🔍</div>
    <p class="empty-text">検索結果が見つかりませんでした</p>
    <p class="text-gray-400 text-sm mt-2">別のキーワードやフィルター設定をお試しください</p>
  </div>
  ${endif}
</div>
